      STORAGE_VERIFICATIONS_BUCKET: "${STORAGE_VERIFICATIONS_BUCKET:-vedora-verifications}"
      STORAGE_SUPPORT_BUCKET: "${STORAGE_SUPPORT_BUCKET:-vedora-support}"
      OPENROUTER_CONTENT_MODERATION_MODEL: "${OPENROUTER_CONTENT_MODERATION_MODEL:-anthropic/claude-haiku-5.5}"
