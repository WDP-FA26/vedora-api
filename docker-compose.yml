services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-api/v1}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-12345}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-3600}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_WEBHOOKS_ENABLED: ${CLOUDINARY_WEBHOOKS_ENABLED:-false}
      CAPTIONS_ENABLED: ${CAPTIONS_ENABLED:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
      OPENROUTER_REASONING_EFFORT: ${OPENROUTER_REASONING_EFFORT:-low}
      OPENROUTER_MODERATION_MODEL: ${OPENROUTER_MODERATION_MODEL:-openai/gpt-oss-safeguard-20b}
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-vedora}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-vedora_local_storage_secret}
      STORAGE_WEBHOOK_TOKEN: ${STORAGE_WEBHOOK_TOKEN:-vedora_local_webhook_token}
      MAX_KNOWLEDGE_FILE_MB: ${MAX_KNOWLEDGE_FILE_MB:-50}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-vedora_knowledge}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-google/gemini-embedding-2}
      KNOWLEDGE_EMBEDDING_DIMENSIONS: ${KNOWLEDGE_EMBEDDING_DIMENSIONS:-1536}
      OPENROUTER_RERANK_MODEL: ${OPENROUTER_RERANK_MODEL-cohere/rerank-v3.5}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vedora}:${POSTGRES_PASSWORD:-vedora_local_password}@postgres:5432/${POSTGRES_DB:-vedora}?schema=public
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/' + process.env.API_PREFIX + '/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vedora}
      POSTGRES_USER: ${POSTGRES_USER:-vedora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vedora_local_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vedora} -d ${POSTGRES_DB:-vedora}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # S3-compatible file storage. The API creates the buckets, the public
  # policy and the event bindings on startup.
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-vedora}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-vedora_local_storage_secret}
      # Browsers upload straight to RustFS from the frontend.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${CORS_ORIGIN:-http://localhost:3000}
      # Upload events, queued on disk and retried while the API is down.
      # Defaults reach an API run on the host (npm run start:dev); for the
      # api service above use http://api:3000/api/v1/webhooks/storage.
      RUSTFS_NOTIFY_ENABLE: "true"
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: ${STORAGE_WEBHOOK_ORIGIN:-http://host.docker.internal:4000}
      RUSTFS_NOTIFY_WEBHOOK_ENABLE_KNOWLEDGE: "on"
      RUSTFS_NOTIFY_WEBHOOK_ENDPOINT_KNOWLEDGE: ${STORAGE_WEBHOOK_BASE_URL:-http://host.docker.internal:4000/api/v1/webhooks/storage}/knowledge
      RUSTFS_NOTIFY_WEBHOOK_AUTH_TOKEN_KNOWLEDGE: ${STORAGE_WEBHOOK_TOKEN:-vedora_local_webhook_token}
      RUSTFS_NOTIFY_WEBHOOK_QUEUE_DIR_KNOWLEDGE: /data/.notify/knowledge
      RUSTFS_NOTIFY_WEBHOOK_ENABLE_PROFILES: "on"
      RUSTFS_NOTIFY_WEBHOOK_ENDPOINT_PROFILES: ${STORAGE_WEBHOOK_BASE_URL:-http://host.docker.internal:4000/api/v1/webhooks/storage}/profiles
      RUSTFS_NOTIFY_WEBHOOK_AUTH_TOKEN_PROFILES: ${STORAGE_WEBHOOK_TOKEN:-vedora_local_webhook_token}
      RUSTFS_NOTIFY_WEBHOOK_QUEUE_DIR_PROFILES: /data/.notify/profiles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9000:9000"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  qdrant_data:
  rustfs_data:
