      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-vedora_knowledge}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-google/gemini-embedding-2}
      KNOWLEDGE_EMBEDDING_DIMENSIONS: ${KNOWLEDGE_EMBEDDING_DIMENSIONS:-1536}
      OPENROUTER_RERANK_MODEL: ${OPENROUTER_RERANK_MODEL-cohere/rerank-v3.5}
      DATABASE_URL: mongodb://${MONGO_USER:-vedora}:${MONGO_PASSWORD:-vedora_local_password}@mongo:27017/${MONGO_DB:-vedora}?authSource=admin&replicaSet=rs0
      PAYMENT_REDIS_URL: ${PAYMENT_REDIS_URL:-redis://redis:6379}
      PAYMENT_EVENTS_CHANNEL: ${PAYMENT_EVENTS_CHANNEL:-vedora:payments:v1}
      SEPAY_PAYMENT_ENABLED: ${SEPAY_PAYMENT_ENABLED:-false}
      SEPAY_PAYMENT_FLOW: ${SEPAY_PAYMENT_FLOW:-bank_transfer_qr}
      SEPAY_QR_BANK_CODE: ${SEPAY_QR_BANK_CODE:-}
      SEPAY_BANK_GATEWAY: ${SEPAY_BANK_GATEWAY:-}
      SEPAY_QR_ACCOUNT_NUMBER: ${SEPAY_QR_ACCOUNT_NUMBER:-}
      SEPAY_QR_ACCOUNT_HOLDER: ${SEPAY_QR_ACCOUNT_HOLDER:-}
      SEPAY_QR_STORE_NAME: ${SEPAY_QR_STORE_NAME:-Vedora}
      SEPAY_QR_TRANSFER_PREFIX: ${SEPAY_QR_TRANSFER_PREFIX:-}
      SEPAY_PAYMENT_CODE_PREFIX: ${SEPAY_PAYMENT_CODE_PREFIX:-VED}
      SEPAY_BANK_WEBHOOK_API_KEY: ${SEPAY_BANK_WEBHOOK_API_KEY:-}
      SUBSCRIPTION_PLUS_PRICE_VND: ${SUBSCRIPTION_PLUS_PRICE_VND:-49000}
      SUBSCRIPTION_PRO_PRICE_VND: ${SUBSCRIPTION_PRO_PRICE_VND:-99000}
      BILLING_DURATION_DAYS: ${BILLING_DURATION_DAYS:-30}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/' + process.env.API_PREFIX + '/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # REDIS_BIND defaults to loopback. Redis here has no password, so only
      # set REDIS_BIND=0.0.0.0 on the VPS together with a firewall rule.
      - "${REDIS_BIND:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Single-node replica set: MongoDB transactions need one. The keyfile
  # is generated once into the volume. From the host (npm run start:dev) use
  # directConnection=true, since the set advertises the in-network name `mongo`.
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    entrypoint:
      - bash
      - -c
      - |
        if [ ! -f /data/configdb/keyfile ]; then
          openssl rand -base64 756 > /data/configdb/keyfile
        fi
        chmod 400 /data/configdb/keyfile
        chown mongodb:mongodb /data/configdb/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/configdb/keyfile --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-vedora}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-vedora_local_password}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-vedora}
    ports:
      # MONGO_BIND defaults to loopback. Set MONGO_BIND=0.0.0.0 in .env on the
      # VPS to accept connections from other machines (open the port in the
      # firewall and restrict it to known IPs).
      - "${MONGO_BIND:-127.0.0.1}:27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      # Initiates the replica set on first run, then reports it healthy.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME"
          -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
          | tail -n 1 | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # S3-compatible file storage. The API creates the buckets, the public
  # policy and the event bindings on startup.
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-vedora}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-vedora_local_storage_secret}
      # Browsers upload straight to RustFS from the frontend.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${CORS_ORIGIN:-http://localhost:3000}
      # Upload events, queued on disk and retried while the API is down.
      # Defaults reach an API run on the host (npm run start:dev); for the
      # api service above use http://api:3000/api/v1/webhooks/storage.
      RUSTFS_NOTIFY_ENABLE: "true"
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: ${STORAGE_WEBHOOK_ORIGIN:-http://host.docker.internal:4000}
      RUSTFS_NOTIFY_WEBHOOK_ENABLE_KNOWLEDGE: "on"
      RUSTFS_NOTIFY_WEBHOOK_ENDPOINT_KNOWLEDGE: ${STORAGE_WEBHOOK_BASE_URL:-http://host.docker.internal:4000/api/v1/webhooks/storage}/knowledge
      RUSTFS_NOTIFY_WEBHOOK_AUTH_TOKEN_KNOWLEDGE: ${STORAGE_WEBHOOK_TOKEN:-vedora_local_webhook_token}
      RUSTFS_NOTIFY_WEBHOOK_QUEUE_DIR_KNOWLEDGE: /data/.notify/knowledge
      RUSTFS_NOTIFY_WEBHOOK_ENABLE_PROFILES: "on"
      RUSTFS_NOTIFY_WEBHOOK_ENDPOINT_PROFILES: ${STORAGE_WEBHOOK_BASE_URL:-http://host.docker.internal:4000/api/v1/webhooks/storage}/profiles
      RUSTFS_NOTIFY_WEBHOOK_AUTH_TOKEN_PROFILES: ${STORAGE_WEBHOOK_TOKEN:-vedora_local_webhook_token}
      RUSTFS_NOTIFY_WEBHOOK_QUEUE_DIR_PROFILES: /data/.notify/profiles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9000:9000"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongo_data:
  mongo_config:
  qdrant_data:
  rustfs_data:
