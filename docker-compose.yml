services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-api/v1}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-12345}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-3600}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/v1/auth/google/callback}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vedora}:${POSTGRES_PASSWORD:-vedora_local_password}@postgres:5432/${POSTGRES_DB:-vedora}?schema=public
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/' + process.env.API_PREFIX + '/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vedora}
      POSTGRES_USER: ${POSTGRES_USER:-vedora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vedora_local_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vedora} -d ${POSTGRES_DB:-vedora}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
