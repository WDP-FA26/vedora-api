services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Dokploy writes the app's Environment tab to .env next to this file; the
    # API gets all of it, and app.module.ts validates it and fills defaults.
    env_file:
      - .env
    # Fixed for this image; these win over .env.
    environment:
      NODE_ENV: production
      PORT: 3000
      PAYMENT_REDIS_URL: ${PAYMENT_REDIS_URL:-redis://redis:6379}
      PAYMENT_EVENTS_CHANNEL: ${PAYMENT_EVENTS_CHANNEL:-vedora:payments:v1}
      STORAGE_ENDPOINT: http://rustfs:9000
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/' + process.env.API_PREFIX + '/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible file storage. In Dokploy, give this service a domain on
  # port 9000 and set STORAGE_PUBLIC_URL to it: browsers upload to it and
  # load profile images from it. The API creates the buckets, the public
  # policy and the event bindings on startup.
  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
      RUSTFS_CORS_ALLOWED_ORIGINS: ${CORS_ORIGIN}
      # Upload events to the api service, queued on disk and retried while
      # it is down.
      RUSTFS_NOTIFY_ENABLE: "true"
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: http://api:3000
      RUSTFS_NOTIFY_WEBHOOK_ENABLE_KNOWLEDGE: "on"
      RUSTFS_NOTIFY_WEBHOOK_ENDPOINT_KNOWLEDGE: http://api:3000/${API_PREFIX:-api/v1}/webhooks/storage/knowledge
      RUSTFS_NOTIFY_WEBHOOK_AUTH_TOKEN_KNOWLEDGE: ${STORAGE_WEBHOOK_TOKEN}
      RUSTFS_NOTIFY_WEBHOOK_QUEUE_DIR_KNOWLEDGE: /data/.notify/knowledge
      RUSTFS_NOTIFY_WEBHOOK_ENABLE_PROFILES: "on"
      RUSTFS_NOTIFY_WEBHOOK_ENDPOINT_PROFILES: http://api:3000/${API_PREFIX:-api/v1}/webhooks/storage/profiles
      RUSTFS_NOTIFY_WEBHOOK_AUTH_TOKEN_PROFILES: ${STORAGE_WEBHOOK_TOKEN}
      RUSTFS_NOTIFY_WEBHOOK_QUEUE_DIR_PROFILES: /data/.notify/profiles
    expose:
      - "9000"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  rustfs_data:
