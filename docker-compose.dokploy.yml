services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Dokploy writes the app's Environment tab to .env next to this file; the
    # API gets all of it, and app.module.ts validates it and fills defaults.
    env_file:
      - .env
    # Fixed for this image; these win over .env.
    environment:
      NODE_ENV: production
      PORT: 3000
      PAYMENT_REDIS_URL: ${PAYMENT_REDIS_URL:-redis://redis:6379}
      PAYMENT_EVENTS_CHANNEL: ${PAYMENT_EVENTS_CHANNEL:-vedora:payments:v1}
    expose:
      - "3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/' + process.env.API_PREFIX + '/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Single-node replica set: MongoDB transactions need one. The keyfile
  # is generated once into the volume. From the host (npm run start:dev) use
  # directConnection=true, since the set advertises the in-network name `mongo`.
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    entrypoint:
      - bash
      - -c
      - |
        if [ ! -f /data/configdb/keyfile ]; then
          openssl rand -base64 756 > /data/configdb/keyfile
        fi
        chmod 400 /data/configdb/keyfile
        chown mongodb:mongodb /data/configdb/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/configdb/keyfile --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    # Bound to the Tailscale address only: reachable from machines on the tailnet,
    # not from the public internet. The API still connects over the internal network.
    ports:
      - "100.108.153.101:27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      # Initiates the replica set on first run, then reports it healthy.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME"
          -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin
          --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
          | tail -n 1 | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo_data:
  mongo_config:
