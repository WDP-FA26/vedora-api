<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="1040" viewBox="0 0 1310 1040" font-family="'Google Sans', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Vedora meal planner AI assistant</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#202124"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#202124" stroke-width="1.5"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <symbol id="people" viewBox="0 0 32 24">
      <circle cx="11" cy="7" r="5" fill="#202124"/>
      <path d="M1,23 C1,16 6,13 11,13 C16,13 21,16 21,23 z" fill="#202124"/>
      <circle cx="23" cy="8" r="4" fill="#202124"/>
      <path d="M19,14 C21,13 23,13 24,13 C28,13 31,16 31,22 L23,22 C23,19 22,16 19,14 z" fill="#202124"/>
    </symbol>
    <symbol id="person-key" viewBox="0 0 32 24">
      <circle cx="11" cy="7" r="5" fill="#202124"/>
      <path d="M1,23 C1,16 6,13 11,13 C16,13 21,16 21,23 z" fill="#202124"/>
      <circle cx="25" cy="9" r="4" fill="none" stroke="#202124" stroke-width="2.2"/>
      <path d="M25,13 V22 M25,18 H28 M25,21 H28" stroke="#202124" stroke-width="2.2"/>
    </symbol>
    <symbol id="db" viewBox="0 0 24 28">
      <ellipse cx="12" cy="5" rx="10" ry="4" fill="none" stroke="#202124" stroke-width="2"/>
      <path d="M2,5 V23 C2,25.5 6.5,27 12,27 C17.5,27 22,25.5 22,23 V5" fill="none" stroke="#202124" stroke-width="2"/>
      <path d="M2,11 C2,13.5 6.5,15 12,15 C17.5,15 22,13.5 22,11 M2,17 C2,19.5 6.5,21 12,21 C17.5,21 22,19.5 22,17" fill="none" stroke="#202124" stroke-width="2"/>
    </symbol>
  </defs>

  <style>
    .t { fill: #202124; font-size: 14px; }
    .b { font-weight: 700; }
    .h { font-size: 16px; font-weight: 700; fill: #202124; }
    .s { font-size: 12px; fill: #3C4043; }
    .xs { font-size: 11px; fill: #5F6368; }
    .m { font-family: 'Roboto Mono', 'DejaVu Sans Mono', monospace; }
    .lbl { font-size: 12px; fill: #202124; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .box { fill: #FFFFFF; stroke: #5F6368; stroke-width: 1.2; }
    .line { fill: none; stroke: #202124; stroke-width: 2; }
    .thin { fill: none; stroke: #202124; stroke-width: 1.2; }
    .dash { stroke-dasharray: 5 4; }
    .step circle { fill: #137333; }
    .step text { fill: #FFFFFF; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .member { fill: #E6F4EA; stroke: #137333; stroke-width: 1.5; }
    .group { fill: #E8F0FE; stroke: #1A73E8; stroke-width: 1.2; stroke-dasharray: 6 4; }
  </style>

  <rect width="1310" height="1040" fill="#FFFFFF"/>

  <!-- ============ Users ============ -->
  <rect x="350" y="20" width="240" height="52" rx="6" class="box"/>
  <use href="#person-key" x="372" y="34" width="32" height="24"/>
  <text x="416" y="51" class="t b" font-size="15">Signed-in members</text>

  <!-- ============ Platform ============ -->
  <rect x="16" y="120" width="1024" height="820" rx="8" fill="#4285F4"/>
  <text x="44" y="154" font-size="22" font-weight="500" fill="#FFFFFF">Vedora platform</text>
  <rect x="28" y="166" width="1000" height="762" rx="4" fill="#FFFFFF"/>

  <!-- Frontend -->
  <rect x="40" y="180" width="780" height="66" rx="6" fill="#F8F9FA" stroke="#DADCE0"/>
  <text x="56" y="202" class="t b">Frontend · Next.js</text>
  <rect x="330" y="190" width="280" height="46" rx="6" class="member"/>
  <text x="470" y="218" class="t b c">Meal planner page</text>

  <!-- Step 1: prompt -->
  <path d="M470,72 V188" class="line" marker-end="url(#arrow)"/>
  <g class="step"><circle cx="448" cy="96" r="11"/><text x="448" y="101">1</text></g>
  <text x="490" y="101" class="lbl">Prompt</text>

  <!-- Human-in-the-loop -->
  <path d="M592,46 H680 V205 H612" class="thin" marker-start="url(#arrow-light)" marker-end="url(#arrow-light)"/>
  <text x="694" y="82" class="lbl">Human-in-the-loop:</text>
  <text x="694" y="99" class="lbl">"Áp dụng" proposal</text>

  <!-- ============ Backend ============ -->
  <rect x="40" y="282" width="780" height="530" rx="4" fill="#CEEAD6" fill-opacity="0.55" stroke="#9AA0A6" filter="url(#shadow)"/>
  <text x="140" y="306" class="h">Backend API · NestJS</text>

  <!-- Step 2: request -->
  <path d="M470,236 V322" class="line" marker-end="url(#arrow)"/>
  <g class="step"><circle cx="448" cy="264" r="11"/><text x="448" y="269">2</text></g>
  <text x="490" y="269" class="lbl m">POST /meal-plan/chat</text>

  <!-- Access -->
  <rect x="320" y="324" width="300" height="44" rx="6" class="member"/>
  <text x="470" y="351" class="t b c">Member auth &amp; AI quota</text>
  <path d="M470,368 V404" class="line" marker-end="url(#arrow)"/>

  <!-- Moderation + canned refusal -->
  <rect x="370" y="406" width="200" height="44" rx="6" fill="#FFFFFF" stroke="#E37400" stroke-width="2"/>
  <text x="470" y="433" class="t b c">Moderation</text>
  <path d="M370,428 H236" class="line" marker-end="url(#arrow)"/>
  <text x="303" y="420" class="xs c">blocked</text>
  <rect x="150" y="406" width="84" height="44" rx="6" fill="#FFFFFF" stroke="#C5221F" stroke-width="1.5"/>
  <text x="192" y="425" class="lbl b c">Canned</text>
  <text x="192" y="441" class="lbl b c">refusal</text>

  <!-- Step 3: allowed -->
  <path d="M470,450 V486" class="line" marker-end="url(#arrow)"/>
  <g class="step"><circle cx="448" cy="469" r="11"/><text x="448" y="474">3</text></g>
  <text x="490" y="474" class="lbl">allow</text>

  <!-- Prompt context (name alone is ambiguous) -->
  <rect x="320" y="488" width="300" height="44" rx="6" class="box"/>
  <text x="470" y="506" class="t b c">Prompt context</text>
  <text x="470" y="523" class="s c">dietary restrictions + saved week</text>
  <path d="M470,532 V568" class="line" marker-end="url(#arrow)"/>

  <!-- LLM -->
  <rect x="320" y="570" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="470" y="594" class="h c">LLM Model</text>
  <text x="470" y="614" class="s c">meal planning + nutrition advice</text>

  <!-- Step 5: response stream -->
  <path d="M320,598 H120 V224 H328" class="line" marker-end="url(#arrow)"/>
  <path d="M150,428 H120" class="line"/>
  <circle cx="120" cy="428" r="4" fill="#202124"/>
  <g class="step"><circle cx="98" cy="510" r="11"/><text x="98" y="515">5</text></g>
  <text x="140" y="515" class="lbl">Response stream</text>

  <!-- Step 4: tool calls -->
  <path d="M470,626 V656" class="line"/>
  <path d="M470,656 H250 V674" class="line" marker-end="url(#arrow)"/>
  <path d="M470,656 V674" class="line" marker-end="url(#arrow)"/>
  <path d="M470,656 H690 V674" class="line" marker-end="url(#arrow)"/>
  <g class="step"><circle cx="448" cy="641" r="10"/><text x="448" y="646">4</text></g>
  <text x="484" y="646" class="lbl">Tool calls / results</text>

  <!-- Tools -->
  <rect x="155" y="676" width="190" height="44" rx="6" class="box"/>
  <text x="250" y="703" class="t b m c">searchKnowledge</text>
  <rect x="375" y="676" width="190" height="44" rx="6" class="box"/>
  <text x="470" y="703" class="t b m c">searchRecipes</text>
  <rect x="595" y="676" width="190" height="44" rx="6" class="box"/>
  <text x="690" y="703" class="t b m c">proposeMealPlan</text>

  <!-- Modules the tools call -->
  <path d="M250,720 V746" class="line" marker-end="url(#arrow)"/>
  <path d="M470,720 V746" class="line" marker-end="url(#arrow)"/>
  <path d="M690,720 V746" class="line" marker-end="url(#arrow)"/>
  <rect x="135" y="748" width="230" height="44" rx="6" class="group"/>
  <text x="250" y="775" class="t b c">KnowledgeSearchService</text>
  <rect x="375" y="748" width="410" height="44" rx="6" class="group"/>
  <text x="580" y="775" class="t b c">MealPlanService</text>

  <!-- ============ Data + ingestion ============ -->
  <path d="M250,792 V848" class="line" marker-end="url(#arrow)"/>
  <rect x="170" y="850" width="160" height="44" rx="6" class="box"/>
  <use href="#db" x="206" y="859" width="20" height="24"/>
  <text x="236" y="877" class="t b">Qdrant</text>

  <rect x="360" y="820" width="556" height="92" rx="6" class="group"/>
  <text x="376" y="840" class="t b">Knowledge ingestion</text>
  <rect x="376" y="850" width="160" height="44" rx="6" class="box"/>
  <text x="456" y="877" class="t b c">Embed chunks</text>
  <rect x="566" y="850" width="160" height="44" rx="6" class="box"/>
  <text x="646" y="877" class="t b c">Extract / OCR</text>
  <rect x="756" y="850" width="144" height="44" rx="6" class="box"/>
  <use href="#db" x="786" y="860" width="20" height="24"/>
  <text x="814" y="877" class="t b">RustFS</text>
  <path d="M756,872 H728" class="line" marker-end="url(#arrow)"/>
  <path d="M566,872 H538" class="line" marker-end="url(#arrow)"/>
  <path d="M376,872 H332" class="line" marker-end="url(#arrow)"/>

  <!-- Right column: telemetry + MongoDB -->
  <rect x="850" y="520" width="160" height="44" rx="6" class="box"/>
  <text x="930" y="547" class="t b c">AI cost telemetry</text>
  <path d="M930,480 V518" class="thin dash" marker-end="url(#arrow-light)"/>
  <text x="940" y="503" class="xs">usage + cost</text>
  <path d="M930,564 V746" class="thin dash" marker-end="url(#arrow-light)"/>

  <rect x="850" y="748" width="160" height="44" rx="6" class="box"/>
  <use href="#db" x="878" y="758" width="20" height="24"/>
  <text x="908" y="775" class="t b">MongoDB</text>
  <path d="M785,770 H848" class="line" marker-end="url(#arrow)"/>

  <!-- ============ Model runtime (external) ============ -->
  <path d="M820,400 H1078" class="line" marker-end="url(#arrow)"/>
  <text x="950" y="390" class="lbl c">Inference requests</text>
  <path d="M1080,480 H822" class="line" marker-end="url(#arrow)"/>
  <text x="950" y="470" class="lbl c">Streamed responses</text>

  <text x="1080" y="318" class="t b">Model runtime:</text>
  <rect x="1080" y="330" width="210" height="222" rx="6" class="box"/>
  <text x="1098" y="360" font-size="18" font-weight="700" fill="#202124">OpenRouter</text>
  <line x1="1098" y1="374" x2="1272" y2="374" stroke="#DADCE0"/>
  <text x="1098" y="405" class="t b">Chat LLM</text>
  <text x="1098" y="437" class="t b">Moderation</text>
  <text x="1098" y="469" class="t b">Embeddings</text>
  <text x="1098" y="501" class="t b">Reranker</text>
  <text x="1098" y="533" class="t b">PDF OCR</text>

  <!-- ============ Administrators ============ -->
  <rect x="700" y="972" width="220" height="52" rx="6" class="box"/>
  <use href="#people" x="720" y="986" width="32" height="24"/>
  <text x="764" y="1004" class="t b" font-size="15">Administrators</text>
  <path d="M828,972 V896" class="thin" marker-end="url(#arrow-light)"/>
  <text x="838" y="962" class="lbl">Upload PDFs</text>
  <path d="M920,998 H960 V794" class="thin" marker-end="url(#arrow-light)"/>
  <text x="972" y="962" class="lbl">AI cost dashboard</text>
</svg>
