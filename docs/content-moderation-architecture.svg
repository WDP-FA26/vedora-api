<svg xmlns="http://www.w3.org/2000/svg" width="1310" height="830" viewBox="0 0 1310 830" font-family="'Google Sans', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>Vedora content moderation</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#202124"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#202124" stroke-width="1.5"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <symbol id="people" viewBox="0 0 32 24">
      <circle cx="11" cy="7" r="5" fill="#202124"/>
      <path d="M1,23 C1,16 6,13 11,13 C16,13 21,16 21,23 z" fill="#202124"/>
      <circle cx="23" cy="8" r="4" fill="#202124"/>
      <path d="M19,14 C21,13 23,13 24,13 C28,13 31,16 31,22 L23,22 C23,19 22,16 19,14 z" fill="#202124"/>
    </symbol>
    <symbol id="person-key" viewBox="0 0 32 24">
      <circle cx="11" cy="7" r="5" fill="#202124"/>
      <path d="M1,23 C1,16 6,13 11,13 C16,13 21,16 21,23 z" fill="#202124"/>
      <circle cx="25" cy="9" r="4" fill="none" stroke="#202124" stroke-width="2.2"/>
      <path d="M25,13 V22 M25,18 H28 M25,21 H28" stroke="#202124" stroke-width="2.2"/>
    </symbol>
    <symbol id="db" viewBox="0 0 24 28">
      <ellipse cx="12" cy="5" rx="10" ry="4" fill="none" stroke="#202124" stroke-width="2"/>
      <path d="M2,5 V23 C2,25.5 6.5,27 12,27 C17.5,27 22,25.5 22,23 V5" fill="none" stroke="#202124" stroke-width="2"/>
      <path d="M2,11 C2,13.5 6.5,15 12,15 C17.5,15 22,13.5 22,11 M2,17 C2,19.5 6.5,21 12,21 C17.5,21 22,19.5 22,17" fill="none" stroke="#202124" stroke-width="2"/>
    </symbol>
  </defs>

  <style>
    .t { fill: #202124; font-size: 14px; }
    .b { font-weight: 700; }
    .h { font-size: 16px; font-weight: 700; fill: #202124; }
    .s { font-size: 12px; fill: #3C4043; }
    .xs { font-size: 11px; fill: #5F6368; }
    .m { font-family: 'Roboto Mono', 'DejaVu Sans Mono', monospace; }
    .lbl { font-size: 12px; fill: #202124; }
    .c { text-anchor: middle; }
    .e { text-anchor: end; }
    .box { fill: #FFFFFF; stroke: #5F6368; stroke-width: 1.2; }
    .line { fill: none; stroke: #202124; stroke-width: 2; }
    .thin { fill: none; stroke: #202124; stroke-width: 1.2; }
    .dash { stroke-dasharray: 5 4; }
    .step circle { fill: #137333; }
    .step text { fill: #FFFFFF; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .member { fill: #E6F4EA; stroke: #137333; stroke-width: 1.5; }
    .group { fill: #E8F0FE; stroke: #1A73E8; stroke-width: 1.2; stroke-dasharray: 6 4; }
  </style>

  <rect width="1310" height="830" fill="#FFFFFF"/>

  <!-- ============ Actors / external ============ -->
  <rect x="55" y="20" width="180" height="52" rx="6" class="box"/>
  <text x="145" y="51" class="t b c" style="font-size:15px">Cloudinary</text>
  <rect x="400" y="20" width="220" height="52" rx="6" class="box"/>
  <use href="#people" x="424" y="34" width="32" height="24"/>
  <text x="468" y="51" class="t b" style="font-size:15px">Members</text>

  <!-- ============ Platform ============ -->
  <rect x="16" y="120" width="948" height="612" rx="8" fill="#4285F4"/>
  <text x="44" y="154" font-size="22" font-weight="500" fill="#FFFFFF">Vedora platform</text>
  <rect x="28" y="166" width="924" height="554" rx="4" fill="#FFFFFF"/>

  <!-- ============ Backend ============ -->
  <rect x="40" y="182" width="900" height="518" rx="4" fill="#CEEAD6" fill-opacity="0.55" stroke="#9AA0A6" filter="url(#shadow)"/>
  <text x="56" y="206" class="h">Backend API · NestJS</text>

  <!-- Entry arrows -->
  <path d="M400,46 H237" class="line" marker-end="url(#arrow)"/>
  <text x="318" y="38" class="xs c">upload video</text>
  <path d="M145,72 V238" class="line" marker-end="url(#arrow)"/>
  <text x="155" y="101" class="lbl">video ready</text>
  <path d="M470,72 V100 H335 V238" class="line" marker-end="url(#arrow)"/>
  <text x="345" y="118" class="lbl">blog</text>
  <path d="M560,72 V100 H810 V238" class="line" marker-end="url(#arrow)"/>
  <text x="820" y="118" class="lbl">comment</text>

  <!-- Callers -->
  <rect x="70" y="240" width="150" height="44" rx="6" class="box"/>
  <text x="145" y="267" class="t b c">MediaService</text>
  <rect x="260" y="240" width="150" height="44" rx="6" class="box"/>
  <text x="335" y="267" class="t b c">BlogsService</text>
  <rect x="450" y="240" width="150" height="44" rx="6" class="box"/>
  <text x="525" y="267" class="t b c">CaptionService</text>
  <rect x="700" y="240" width="220" height="44" rx="6" class="box"/>
  <text x="810" y="267" class="t b c">PostInteractionsService</text>

  <!-- Post path -->
  <path d="M145,284 V312 H525 V284" class="line"/>
  <path d="M335,312 V338" class="line" marker-end="url(#arrow)"/>
  <rect x="205" y="340" width="260" height="44" rx="6" class="member"/>
  <text x="335" y="367" class="t b c">PostModerationService</text>

  <rect x="505" y="330" width="220" height="94" rx="6" class="group"/>
  <text x="517" y="348" class="lbl b">Content parts</text>
  <rect x="517" y="356" width="96" height="26" rx="5" class="box"/>
  <text x="565" y="374" class="lbl b c">Text</text>
  <rect x="621" y="356" width="96" height="26" rx="5" class="box"/>
  <text x="669" y="374" class="lbl b c">Video frames</text>
  <rect x="517" y="388" width="96" height="26" rx="5" class="box"/>
  <text x="565" y="406" class="lbl b c">Transcript</text>
  <rect x="621" y="388" width="96" height="26" rx="5" class="box"/>
  <text x="669" y="406" class="lbl b c">Blog images</text>
  <path d="M505,362 H467" class="line" marker-end="url(#arrow)"/>

  <!-- Caller <-> core -->
  <path d="M320,384 V468" class="line" marker-end="url(#arrow)"/>
  <path d="M420,470 V386" class="line" marker-end="url(#arrow)"/>
  <text x="430" y="452" class="lbl">publish · review · reject</text>
  <path d="M760,284 V468" class="line" marker-end="url(#arrow)"/>
  <path d="M870,470 V286" class="line" marker-end="url(#arrow)"/>
  <text x="880" y="376" class="xs">reject</text>
  <text x="880" y="390" class="xs">→ 422</text>

  <!-- Core -->
  <rect x="300" y="470" width="620" height="92" rx="10" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="316" y="492" class="t b">ContentModerationService</text>
  <rect x="330" y="504" width="220" height="44" rx="6" class="box"/>
  <text x="440" y="531" class="t b c">Classify</text>
  <rect x="670" y="504" width="220" height="44" rx="6" class="box"/>
  <text x="780" y="531" class="t b c">Score</text>
  <path d="M550,526 H668" class="line" marker-end="url(#arrow)"/>

  <!-- Post outcomes (written by PostModerationService) -->
  <path d="M230,384 V502" class="line" marker-end="url(#arrow)"/>
  <text x="222" y="448" class="xs e">review / reject</text>
  <rect x="70" y="504" width="190" height="44" rx="6" class="box"/>
  <text x="165" y="531" class="t b c">NotificationsService</text>
  <path d="M205,362 H52 V652 H78" class="line" marker-end="url(#arrow)"/>

  <rect x="80" y="630" width="160" height="44" rx="6" class="box"/>
  <use href="#db" x="108" y="640" width="20" height="24"/>
  <text x="138" y="657" class="t b">MongoDB</text>

  <rect x="320" y="630" width="240" height="44" rx="6" class="box"/>
  <text x="440" y="657" class="t b c">ModerationSettingsService</text>
  <path d="M440,630 V564" class="line" marker-end="url(#arrow)"/>
  <path d="M320,652 H242" class="line" marker-end="url(#arrow)"/>

  <!-- ============ Model runtime ============ -->
  <path d="M940,500 H1078" class="line" marker-end="url(#arrow)"/>
  <text x="1010" y="490" class="xs c">request</text>
  <path d="M1080,540 H942" class="line" marker-end="url(#arrow)"/>
  <text x="1010" y="530" class="xs c">probabilities</text>
  <text x="1080" y="452" class="t b">Model runtime:</text>
  <rect x="1080" y="464" width="210" height="96" rx="6" class="box"/>
  <text x="1098" y="494" font-size="18" font-weight="700" fill="#202124">OpenRouter</text>
  <line x1="1098" y1="508" x2="1272" y2="508" stroke="#DADCE0"/>
  <text x="1098" y="537" class="t b">Content moderation</text>

  <!-- ============ Administrators ============ -->
  <rect x="350" y="764" width="220" height="52" rx="6" class="box"/>
  <use href="#people" x="370" y="778" width="32" height="24"/>
  <text x="414" y="796" class="t b" style="font-size:15px">Administrators</text>
  <path d="M440,764 V676" class="thin" marker-end="url(#arrow-light)"/>
  <text x="450" y="754" class="lbl">Edit · reset · test policy</text>
  <path d="M350,790 H280 V386" class="thin" marker-end="url(#arrow-light)"/>
  <text x="272" y="754" class="lbl e">Review queue: approve / reject</text>
</svg>
